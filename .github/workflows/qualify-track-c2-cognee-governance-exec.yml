name: Qualify Track C2 Cognee Governance Executable
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qualify-track-c2-cognee-governance-exec.yml'
      - 'tests/qualification/track-c2/specialists/cognee-governance-exec.py'
      - 'tests/qualification/track-c2/specialists/verify-cognee-governance-exec.py'
permissions:
  contents: read
jobs:
  cognee-governance-executable:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REQUIRE_AUTHENTICATION: 'true'
      ENABLE_BACKEND_ACCESS_CONTROL: 'true'
      HASH_API_KEY: 'false'
      FASTAPI_USERS_JWT_SECRET: 'yukh-qualification-only-secret'
      DATA_ROOT_DIRECTORY: ${{ github.workspace }}/runtime/cognee/data
      SYSTEM_ROOT_DIRECTORY: ${{ github.workspace }}/runtime/cognee/system
      DB_PROVIDER: sqlite
      DB_NAME: cognee_ov89
      GRAPH_DATABASE_PROVIDER: kuzu
      GRAPH_DATASET_DATABASE_HANDLER: kuzu
      VECTOR_DB_PROVIDER: lancedb
      VECTOR_DATASET_DATABASE_HANDLER: lancedb
      LLM_API_KEY: qualification-not-used
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: topoteretes/cognee
          ref: 690c0ec023719a2a277dc893cdecfec1ca8012cc
          path: external/cognee
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install pinned Cognee
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e external/cognee
          mkdir -p runtime/cognee/data runtime/cognee/system artifacts/track-c2-specialists
      - name: A owns M and B is denied
        run: python tests/qualification/track-c2/specialists/cognee-governance-exec.py setup artifacts/track-c2-specialists/cognee-state.json
      - name: Explicit public grant to active B
        run: python tests/qualification/track-c2/specialists/cognee-governance-exec.py grant artifacts/track-c2-specialists/cognee-state.json artifacts/track-c2-specialists/cognee-grant.json
      - name: Explicit public revoke while A B M remain alive
        run: python tests/qualification/track-c2/specialists/cognee-governance-exec.py revoke artifacts/track-c2-specialists/cognee-state.json artifacts/track-c2-specialists/cognee-revoke.json
      - name: Fresh app process verifies persisted revoke
        run: python tests/qualification/track-c2/specialists/cognee-governance-exec.py restart artifacts/track-c2-specialists/cognee-state.json artifacts/track-c2-specialists/cognee-restart.json
      - name: Finalize normalized evidence
        run: python tests/qualification/track-c2/specialists/cognee-governance-exec.py finalize artifacts/track-c2-specialists/cognee-state.json artifacts/track-c2-specialists/cognee-grant.json artifacts/track-c2-specialists/cognee-revoke.json artifacts/track-c2-specialists/cognee-restart.json artifacts/track-c2-specialists/cognee-governance-exec.json
      - name: Verify COMPLEMENT_PASS
        run: python tests/qualification/track-c2/specialists/verify-cognee-governance-exec.py artifacts/track-c2-specialists/cognee-governance-exec.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: track-c2-cognee-governance-exec-690c0ec0
          path: artifacts/track-c2-specialists
          if-no-files-found: error
          retention-days: 30
