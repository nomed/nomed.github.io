name: Qualify Track A recovery and adapter cost

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qualify-track-a-recovery.yml'
      - 'tests/qualification/track-a/candidates.json'
      - 'tests/qualification/track-a/recovery-adapter-cost-v2.mjs'
      - 'tests/qualification/track-a/verify-recovery-adapter-cost.mjs'
      - 'tests/qualification/track-a/fixture/hello.txt'

permissions:
  contents: read

concurrency:
  group: track-a-recovery-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  recovery:
    name: ${{ matrix.candidate }} restart/recovery + adapter cost
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: goose
            repository: aaif-goose/goose
            revision: bd16fbfbbe78cadc2cc3ce6295691772df51d71f
            source_dir: external/goose
          - candidate: hermes
            repository: NousResearch/hermes-agent
            revision: a0ca7c19204e514f9590ce3b812e029b315ab9e9
            source_dir: external/hermes

    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout pinned candidate
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: ${{ matrix.source_dir }}
          persist-credentials: false

      - name: Setup Python for Hermes
        if: matrix.candidate == 'hermes'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Hermes public CLI profile
        if: matrix.candidate == 'hermes'
        working-directory: external/hermes
        run: python -m pip install -e '.[all]'

      - name: Prebuild goose outside recovery timing
        if: matrix.candidate == 'goose'
        working-directory: external/goose
        run: cargo build --quiet -p goose-cli --bin goose

      - name: Execute restart/recovery qualification
        shell: bash
        run: |
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          node tests/qualification/track-a/recovery-adapter-cost-v2.mjs \
            '${{ matrix.candidate }}' \
            '${{ matrix.source_dir }}' \
            'artifacts/track-a-recovery'

      - name: Verify recovery evidence
        run: >-
          node tests/qualification/track-a/verify-recovery-adapter-cost.mjs
          'artifacts/track-a-recovery/${{ matrix.candidate }}-recovery-adapter-cost.json'

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: track-a-recovery-${{ matrix.candidate }}-${{ matrix.revision }}
          path: artifacts/track-a-recovery/${{ matrix.candidate }}-recovery-adapter-cost.json
          if-no-files-found: error
          retention-days: 30
