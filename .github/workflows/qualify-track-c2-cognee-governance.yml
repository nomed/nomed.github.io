name: Qualify Track C2 Cognee Governance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qualify-track-c2-cognee-governance.yml'
      - 'tests/qualification/track-c2/specialists/cognee-**'
      - 'tests/qualification/track-c2/specialists/verify-cognee-**'
permissions:
  contents: read
jobs:
  cognee-governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: topoteretes/cognee
          ref: 690c0ec023719a2a277dc893cdecfec1ca8012cc
          path: external/cognee
          persist-credentials: false
      - name: Execute preflight
        run: python tests/qualification/track-c2/specialists/cognee-governance-preflight.py external/cognee artifacts/track-c2-specialists/cognee-governance-preflight.json
      - name: Verify evidence
        run: python tests/qualification/track-c2/specialists/verify-cognee-governance-preflight.py artifacts/track-c2-specialists/cognee-governance-preflight.json
      - uses: actions/upload-artifact@v6
        with:
          name: track-c2-cognee-governance-preflight-690c0ec0
          path: artifacts/track-c2-specialists/cognee-governance-preflight.json
          if-no-files-found: error
          retention-days: 30
