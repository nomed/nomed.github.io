name: Qualify Track C2 OpenViking OV-5

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qualify-track-c2-openviking-ov5.yml'
      - 'tests/qualification/track-c2/openviking/ov5-**'
      - 'tests/qualification/track-c2/openviking/verify-ov5-**'

permissions:
  contents: read

jobs:
  ov5-governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout pinned OpenViking
        uses: actions/checkout@v7
        with:
          repository: volcengine/OpenViking
          ref: 234a2d9fe778a9512fd7ebe9807198e847c647ec
          path: external/openviking
          persist-credentials: false
      - name: Execute OV-5 governance preflight
        run: >-
          python tests/qualification/track-c2/openviking/ov5-governance-preflight.py
          external/openviking
          artifacts/track-c2-openviking/openviking-ov5-preflight.json
      - name: Verify OV-5 governance evidence
        run: >-
          python tests/qualification/track-c2/openviking/verify-ov5-governance-preflight.py
          artifacts/track-c2-openviking/openviking-ov5-preflight.json
      - name: Upload OV-5 preflight evidence
        uses: actions/upload-artifact@v6
        with:
          name: track-c2-openviking-ov5-preflight-234a2d9f
          path: artifacts/track-c2-openviking/openviking-ov5-preflight.json
          if-no-files-found: error
          retention-days: 30
